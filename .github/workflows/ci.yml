name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --check

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macOS-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release
        run: cargo build --release --locked

      - name: Create package directory
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="sox-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${ARCHIVE_NAME}/examples"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/release/sox.exe" "dist/${ARCHIVE_NAME}/"
          else
            cp "target/release/sox" "dist/${ARCHIVE_NAME}/"
          fi

          cp README.md "dist/${ARCHIVE_NAME}/"
          [ -f LICENSE-MIT ] && cp LICENSE-MIT "dist/${ARCHIVE_NAME}/"
          [ -f LICENSE-LGPL ] && cp LICENSE-LGPL "dist/${ARCHIVE_NAME}/"
          cp examples/* "dist/${ARCHIVE_NAME}/examples/" 2>/dev/null || true

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="sox-${VERSION}-${{ matrix.target }}"
          tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $archiveName = "sox-${version}-${{ matrix.target }}"
          $distDir = "dist"
          Compress-Archive -Path "$distDir/$archiveName/*" -DestinationPath "$distDir/${archiveName}.zip" -Force

      - name: Generate SHA256 checksums
        run: |
          cd dist
          for f in sox-*.*; do
            [ -f "$f" ] && sha256sum "$f" >> SHA256SUMS.txt
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist/

      - name: List packages
        run: ls -lh dist/

      - name: Generate release notes
        run: |
          {
            echo "## sox ${{ github.ref_name }}"
            echo ""
            echo "### Downloads"
            echo ""
          } > /tmp/release-notes.md
          ls dist/ | while IFS= read -r f; do
            echo "- \`$f\`" >> /tmp/release-notes.md
          done
          echo "" >> /tmp/release-notes.md
          echo "---" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### Changes since previous tag" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          PREV=$(git tag --sort=-version:refname | head -2 | tail -1 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            git log --pretty=format:"- %s (%h)" "${PREV}..HEAD" >> /tmp/release-notes.md 2>/dev/null || true
          else
            git log --pretty=format:"- %s (%h)" >> /tmp/release-notes.md 2>/dev/null || true
          fi
          cat /tmp/release-notes.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          ASSETS=()
          for f in *.tar.gz *.zip SHA256SUMS.txt; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          gh release create "${{ github.ref_name }}" \
            "${ASSETS[@]}" \
            --title "sox ${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
