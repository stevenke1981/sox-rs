name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --check

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
          - os: macOS-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release
        run: cargo build --release --locked

      - name: Create package directory
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="sox-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${ARCHIVE_NAME}/examples"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/release/sox.exe" "dist/${ARCHIVE_NAME}/"
          else
            cp "target/release/sox" "dist/${ARCHIVE_NAME}/"
          fi

          cp README.md "dist/${ARCHIVE_NAME}/"
          [ -f LICENSE-MIT ] && cp LICENSE-MIT "dist/${ARCHIVE_NAME}/"
          [ -f LICENSE-LGPL ] && cp LICENSE-LGPL "dist/${ARCHIVE_NAME}/"
          cp examples/* "dist/${ARCHIVE_NAME}/examples/" 2>/dev/null || true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          find . -name "sox-*" -type f | while read f; do
            sha256sum "$f" >> SHA256SUMS.txt
          done

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="sox-${VERSION}-${{ matrix.target }}"
          cd dist
          tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $archiveName = "sox-${version}-${{ matrix.target }}"
          Compress-Archive -Path "dist/$archiveName/*" -DestinationPath "dist/${archiveName}.zip" -Force

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist/

      - name: List packages
        shell: bash
        run: ls -lh dist/

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          {
            echo "### sox ${{ github.ref_name }}"
            echo ""
            echo "**Platform packages:**"
            echo ""
            ls dist/ | while read f; do
              echo "- \`$f\`"
            done
            echo ""
            echo "---"
            echo ""
            echo "### Changes"
            echo ""
          } > /tmp/release-notes.md
          git log --pretty=format:"- %s (%h)" "$(git tag --sort=-version:refname | head -1)^"..HEAD >> /tmp/release-notes.md 2>/dev/null || true
          cat /tmp/release-notes.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd dist
          # Collect all release assets
          ASSETS=()
          for f in *.tar.gz *.zip SHA256SUMS.txt; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          gh release create "${{ github.ref_name }}" \
            "${ASSETS[@]}" \
            --title "sox ${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
