name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --check

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
          - os: macOS-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release
        run: cargo build --release --locked

      - name: Create package directory
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="sox-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${ARCHIVE_NAME}/examples"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/release/sox.exe" "dist/${ARCHIVE_NAME}/"
          else
            cp "target/release/sox" "dist/${ARCHIVE_NAME}/"
          fi

          cp README.md "dist/${ARCHIVE_NAME}/"
          [ -f LICENSE-MIT ] && cp LICENSE-MIT "dist/${ARCHIVE_NAME}/"
          [ -f LICENSE-LGPL ] && cp LICENSE-LGPL "dist/${ARCHIVE_NAME}/"
          cp examples/* "dist/${ARCHIVE_NAME}/examples/" 2>/dev/null || true

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="sox-${VERSION}-${{ matrix.target }}"
          cd dist
          tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $archiveName = "sox-${version}-${{ matrix.target }}"
          $distDir = "dist/$archiveName"
          Compress-Archive -Path "$distDir/*" -DestinationPath "dist/${archiveName}.zip" -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sox-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/sox-*.*
