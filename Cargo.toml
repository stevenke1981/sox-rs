[package]
name = "rust-sox"
version = "0.1.0"
edition = "2024"
description = "A Rust-first, SoX-inspired audio processor"
license = "LGPL-2.1-or-later OR MIT"

[[bin]]
name = "sox"
path = "src/main.rs"

[lib]
name = "rust_sox"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
hound = "3.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", features = ["all"] }
